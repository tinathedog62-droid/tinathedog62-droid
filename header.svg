<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="roughen">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.08" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="ink-blur">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e4dd"/>
      <stop offset="50%" stop-color="#dedad3"/>
      <stop offset="100%" stop-color="#d4d0c9"/>
    </linearGradient>
    <linearGradient id="ink-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#1a1a2e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.3"/>
    </linearGradient>
    <marker id="sp" markerWidth="4" markerHeight="4" refX="2" refY="2">
      <polygon points="2,0 4,2 2,4 0,2" fill="#1a1a2e" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background: muted cream-grey like the profile photo -->
  <rect width="900" height="280" fill="url(#bg-grad)"/>
  <!-- Subtle noise texture overlay -->
  <rect width="900" height="280" fill="#c8c4bd" opacity="0.08" filter="url(#grain)"/>

  <!-- ── DS monogram, hand-sketch style, top-left ── -->
  <g transform="translate(42, 38)" filter="url(#roughen)" opacity="0.92">
    <!-- D shape: outer strokes -->
    <line x1="0" y1="2" x2="2" y2="68" stroke="#1a1a2e" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="0" y1="3" x2="28" y2="0" stroke="#1a1a2e" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="1" y1="67" x2="30" y2="70" stroke="#1a1a2e" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="27" y1="1" x2="42" y2="18" stroke="#1a1a2e" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="30" y1="69" x2="44" y2="54" stroke="#1a1a2e" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="41" y1="19" x2="45" y2="35" stroke="#1a1a2e" stroke-width="2.3" stroke-linecap="round"/>
    <line x1="44" y1="53" x2="46" y2="36" stroke="#1a1a2e" stroke-width="2.3" stroke-linecap="round"/>
    <!-- D inner parallel for depth -->
    <line x1="5" y1="10" x2="6" y2="58" stroke="#1a1a2e" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
    <line x1="5" y1="11" x2="24" y2="9" stroke="#1a1a2e" stroke-width="1.1" stroke-linecap="round" opacity="0.4"/>
    <line x1="6" y1="57" x2="25" y2="60" stroke="#1a1a2e" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <!-- star spark at vertex -->
    <line x1="26" y1="1" x2="32" y2="-6" stroke="#1a1a2e" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
    <line x1="28" y1="0" x2="20" y2="-5" stroke="#1a1a2e" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
    <line x1="28" y1="0" x2="34" y2="5" stroke="#1a1a2e" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

    <!-- S shape: diamond-ish, offset right -->
    <g transform="translate(62, 0)">
      <!-- top diamond -->
      <line x1="14" y1="0" x2="34" y2="0" stroke="#1a1a2e" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="14" y1="1" x2="0" y2="16" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="34" y1="1" x2="48" y2="16" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="1" y1="17" x2="47" y2="17" stroke="#1a1a2e" stroke-width="2.6" stroke-linecap="round"/>
      <!-- bottom diamond -->
      <line x1="1" y1="52" x2="47" y2="52" stroke="#1a1a2e" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="0" y1="52" x2="14" y2="68" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="52" x2="34" y2="68" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="15" y1="69" x2="33" y2="69" stroke="#1a1a2e" stroke-width="2.7" stroke-linecap="round"/>
      <!-- connecting diagonal -->
      <line x1="2" y1="17" x2="46" y2="52" stroke="#1a1a2e" stroke-width="2.3" stroke-linecap="round"/>
      <!-- inner depth lines -->
      <line x1="14" y1="5" x2="34" y2="5" stroke="#1a1a2e" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
      <line x1="8" y1="17" x2="40" y2="17" stroke="#1a1a2e" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>
      <!-- star sparks at vertices -->
      <line x1="14" y1="0" x2="8" y2="-7" stroke="#1a1a2e" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
      <line x1="14" y1="0" x2="10" y2="5" stroke="#1a1a2e" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
      <line x1="34" y1="0" x2="40" y2="-7" stroke="#1a1a2e" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
      <line x1="34" y1="0" x2="38" y2="5" stroke="#1a1a2e" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
      <line x1="47" y1="52" x2="54" y2="58" stroke="#1a1a2e" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
      <line x1="47" y1="52" x2="54" y2="46" stroke="#1a1a2e" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
      <line x1="0" y1="52" x2="-7" y2="46" stroke="#1a1a2e" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
    </g>
  </g>

  <!-- ── Vertical divider line, ink-drawn style ── -->
  <line x1="230" y1="30" x2="228" y2="250" stroke="#1a1a2e" stroke-width="1.1" stroke-linecap="round" opacity="0.22" filter="url(#roughen)"/>

  <!-- ── Name & tagline text block ── -->
  <text x="258" y="88" font-family="'Courier New', Courier, monospace" font-size="38" font-weight="700" fill="#1a1a2e" opacity="0.88" letter-spacing="-1" filter="url(#roughen)">DripsAin</text>

  <!-- thin underline, hand-drawn feel -->
  <path d="M258,96 Q400,100 540,95" stroke="#1a1a2e" stroke-width="1.2" fill="none" opacity="0.25" stroke-linecap="round"/>

  <text x="260" y="130" font-family="'Courier New', Courier, monospace" font-size="13" fill="#1a1a2e" opacity="0.58" letter-spacing="2.5">BUILDER · MAKER · TINKERER</text>

  <!-- ── Keyword chips ── -->
  <g font-family="'Courier New', Courier, monospace" font-size="11" fill="#1a1a2e" opacity="0.72" filter="url(#roughen)">
    <!-- chip backgrounds, slightly off-white -->
    <rect x="259" y="155" width="86" height="22" rx="2" fill="#1a1a2e" opacity="0.07"/>
    <text x="267" y="170" letter-spacing="1">3D / Blender</text>

    <rect x="355" y="155" width="100" height="22" rx="2" fill="#1a1a2e" opacity="0.07"/>
    <text x="363" y="170" letter-spacing="1">Electronics</text>

    <rect x="465" y="155" width="108" height="22" rx="2" fill="#1a1a2e" opacity="0.07"/>
    <text x="473" y="170" letter-spacing="1">Video Editing</text>

    <rect x="583" y="155" width="122" height="22" rx="2" fill="#1a1a2e" opacity="0.07"/>
    <text x="591" y="170" letter-spacing="1">RPi / ESP32</text>

    <rect x="715" y="155" width="62" height="22" rx="2" fill="#1a1a2e" opacity="0.07"/>
    <text x="723" y="170" letter-spacing="1">WASM</text>
  </g>

  <!-- ── Bottom tagline ── -->
  <text x="260" y="220" font-family="'Courier New', Courier, monospace" font-size="12" fill="#1a1a2e" opacity="0.40" letter-spacing="1.5">hobby-scale. production-thinking.</text>

  <!-- ── Decorative corner scratch marks ── -->
  <g stroke="#1a1a2e" stroke-linecap="round" opacity="0.18" filter="url(#roughen)">
    <!-- bottom right corner ornament -->
    <line x1="830" y1="240" x2="875" y2="240" stroke-width="1.5"/>
    <line x1="875" y1="215" x2="875" y2="240" stroke-width="1.5"/>
    <line x1="852" y1="240" x2="875" y2="217" stroke-width="1"/>
    <!-- top right -->
    <line x1="855" y1="30" x2="885" y2="30" stroke-width="1.2"/>
    <line x1="885" y1="30" x2="885" y2="58" stroke-width="1.2"/>
  </g>

  <!-- ── Subtle horizontal rule near bottom ── -->
  <path d="M42,250 Q450,247 858,250" stroke="#1a1a2e" stroke-width="0.8" fill="none" opacity="0.15" stroke-linecap="round"/>
</svg>
