<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Background gradient: cream-grey from the profile photo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9e5de"/>
      <stop offset="55%" stop-color="#dedad3"/>
      <stop offset="100%" stop-color="#cec9c1"/>
    </linearGradient>

    <!-- Grain texture filter -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Ink roughen for sketch feel -->
    <filter id="roughen">
      <feTurbulence type="turbulence" baseFrequency="0.018 0.06" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Soft glow for animated sparks -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip the whole banner -->
    <clipPath id="bounds">
      <rect width="900" height="500"/>
    </clipPath>

  </defs>

  <!-- ═══════════════════════════════════════════
       BACKGROUND LAYER
  ═══════════════════════════════════════════ -->
  <g clip-path="url(#bounds)">
    <rect width="900" height="500" fill="url(#bg)"/>
